// ── AudioContext fix ──
function resumeAudioContext() {
  try {
    if (window.AudioContext || window.webkitAudioContext) {
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      var ctx = new AudioCtx();
      if (ctx.state === 'suspended') ctx.resume().catch(function(){});
    }
  } catch (e) {}
  document.removeEventListener('click', resumeAudioContext);
  document.removeEventListener('touchstart', resumeAudioContext);
  document.removeEventListener('keydown', resumeAudioContext);
}
document.addEventListener('click', resumeAudioContext);
document.addEventListener('touchstart', resumeAudioContext);
document.addEventListener('keydown', resumeAudioContext);

// BLOCK TO COMMAND (voor Run/JSON)
// ══════════════════════════════════════════════
function blockToCommand(block) {
  switch (block.type) {
    case 'move_steps': return { action:'move_forward', value:parseFloat(block.getFieldValue('STEPS'))||1 };
    case 'move_backward': return { action:'move_backward', value:parseFloat(block.getFieldValue('STEPS'))||1 };
    case 'move_up': return { action:'move_up', value:parseFloat(block.getFieldValue('STEPS'))||1 };
    case 'move_down': return { action:'move_down', value:parseFloat(block.getFieldValue('STEPS'))||1 };
    case 'set_position': return { action:'set_position', x:parseFloat(block.getFieldValue('X'))||0, y:parseFloat(block.getFieldValue('Y'))||0, z:parseFloat(block.getFieldValue('Z'))||0 };
    case 'turn_direction': return { action:block.getFieldValue('DIR')==='right'?'turn_right':'turn_left', value:parseFloat(block.getFieldValue('DEGREES'))||90 };
    case 'set_scale': return { action:'set_scale', value:parseFloat(block.getFieldValue('SCALE'))||1 };
    case 'set_color': return { action:'set_color', color:block.getFieldValue('COLOR')||'#ffffff' };
    case 'say_message': return { action:'say', text:block.getFieldValue('TEXT')||'' };
    case 'destroy_by_tag': return { action:'destroy_by_tag', text:(block.getFieldValue('TAG')||'').trim() };
    case 'set_text':
      var textValue = getRuntimeTextValue(block.getInputTargetBlock('TEXT'));
      if (!textValue.supported) return null;
      return { action:'set_text', target:block.getFieldValue('VARNAME')||'', text:textValue.text, textVariable:textValue.variable, textParts:textValue.parts };
    case 'variables_set':
      var variableValue = getRuntimeTextValue(block.getInputTargetBlock('VALUE'));
      if (!variableValue.supported) return null;
      return { action:'set_variable', variable:block.getFieldValue('VAR'), text:variableValue.text, valueVariable:variableValue.variable, textParts:variableValue.parts };
    case 'follow_object':
    case 'move_towards_object': return { action:block.type, text:block.getFieldValue('VARNAME')||'', value:parseFloat(block.getFieldValue('SPEED'))||5 };
    default: return null;
  }
}

function getRuntimeTextValue(block) {
  if (!block) return { text:'', variable:'', parts:[], supported:false };
  if (block.type === 'text') {
    var text = block.getFieldValue('TEXT')||'';
    return { text:text, variable:'', parts:[{text:text, variable:''}], supported:true };
  }
  if (block.type === 'variables_get') {
    var variable = block.getFieldValue('VAR')||'';
    return { text:'', variable:variable, parts:[{text:'', variable:variable}], supported:true };
  }
  if (block.type === 'text_join') {
    var parts=[];
    for (var i=0;i<block.itemCount_;i++) {
      var child=block.getInputTargetBlock('ADD'+i);
      if (!child) {
        parts.push({text:'', variable:''});
        continue;
      }
      var value=getRuntimeTextValue(child);
      if (!value.supported) return { text:'', variable:'', parts:[], supported:false };
      parts=parts.concat(value.parts);
    }
    return { text:'', variable:'', parts:parts, supported:true };
  }
  return { text:'', variable:'', parts:[], supported:false };
}

function collectStatementCommands(firstBlock, commands) {
  var current = firstBlock;
  while (current) {
    var cmd = blockToCommand(current);
    if (cmd) commands.push(cmd);
    if (current.type === 'when_game_starts')
      collectStatementCommands(current.getInputTargetBlock('DO'), commands);
    current = current.getNextBlock();
  }
}

function getProgram() {
  var commands = [];
  var updateCommands = [];
  workspace.getTopBlocks(true).forEach(function(block) {
    if (block.type === 'when_game_starts')
      collectStatementCommands(block.getInputTargetBlock('DO'), commands);
    else if (block.type === 'when_game_updates')
      collectStatementCommands(block.getInputTargetBlock('DO'), updateCommands);
    else
      collectStatementCommands(block, commands);
  });
  return { commands: commands, updateCommands: updateCommands };
}

Blockly.CSharp.forBlock['move_left'] = function(b) {
  var v=Number(b.getFieldValue('STEPS'))||1;
  return 'MoveBy(Vector2.left * '+v.toFixed(1)+'f);\n';
};
Blockly.CSharp.forBlock['move_right'] = function(b) {
  var v=Number(b.getFieldValue('STEPS'))||1;
  return 'MoveBy(Vector2.right * '+v.toFixed(1)+'f);\n';
};
Blockly.CSharp.forBlock['create_object'] = function(block) {
  var v = (block.getFieldValue('VARNAME')||'myPrefab').replace(/[^a-zA-Z0-9_]/g,'');
  if (prefabDeclarations.indexOf(v)===-1) prefabDeclarations.push(v);
  return 'if ('+v+' != null) { var obj = Instantiate('+v+', transform.position, transform.rotation); } else Debug.LogError("Assign prefab field in Inspector: " + '+JSON.stringify(v)+');\n';
};
Blockly.CSharp.forBlock['create_object_at_position'] = function(block) {
  var v = (block.getFieldValue('VARNAME')||'myPrefab').replace(/[^a-zA-Z0-9_]/g,'');
  var x = Number(block.getFieldValue('X'))||0;
  var y = Number(block.getFieldValue('Y'))||0;
  var z = Number(block.getFieldValue('Z'))||0;
  if (prefabDeclarations.indexOf(v)===-1) prefabDeclarations.push(v);
  return 'if ('+v+' != null) { var obj = Instantiate('+v+', new Vector3('+x.toFixed(1)+'f, '+y.toFixed(1)+'f, '+z.toFixed(1)+'f), Quaternion.identity); } else Debug.LogError("Assign prefab field in Inspector: " + '+JSON.stringify(v)+');\n';
};
Blockly.CSharp.forBlock['respawn_named'] = function(block) {
  var prefab = (block.getFieldValue('PREFAB')||'ricardoPrefab').replace(/[^a-zA-Z0-9_]/g,'')||'ricardoPrefab';
  var x = Number(block.getFieldValue('X'))||0;
  var y = Number(block.getFieldValue('Y'))||0;
  var z = Number(block.getFieldValue('Z'))||0;
  if (prefabDeclarations.indexOf(prefab)===-1) prefabDeclarations.push(prefab);
  return 'if ('+prefab+' == null) Debug.LogError("Assign prefab field in Inspector: " + '+JSON.stringify(prefab)+'); else { var replacement = Instantiate('+prefab+', new Vector3('+x.toFixed(1)+'f, '+y.toFixed(1)+'f, '+z.toFixed(1)+'f), transform.rotation); Debug.Log("Respawned " + replacement.name + " at " + replacement.transform.position); Destroy(gameObject); }\n';
};
Blockly.CSharp.forBlock['destroy_object'] = function(block) {
  return 'Destroy(gameObject);\n';
};

function generateFiltered2DEvent(block, methodName, parameterType) {
  var filterType=block.getFieldValue('FILTER_TYPE')||'any';
  var filterValue=(block.getFieldValue('FILTER_VALUE')||'').trim();
  var body=Blockly.CSharp.statementToCode(block,'DO');
  var signature='void '+methodName+'('+parameterType+' other)';
  var eventLog='  Debug.Log("Blockly '+methodName+' with " + other.gameObject.name + " (tag " + other.gameObject.tag + ")");\n';
  var full;
  if (filterType==='any'||(filterType!=='color'&&!filterValue)) full=signature+' {\n'+eventLog+body+'}\n';
  else if (filterType==='tag') full=signature+' {\n'+eventLog+'  if (other.gameObject.CompareTag('+JSON.stringify(filterValue)+')) {\n'+body+'  }\n}\n';
  else if (filterType==='name') full=signature+' {\n'+eventLog+'  if (other.gameObject.name == '+JSON.stringify(filterValue)+') {\n'+body+'  }\n}\n';
  else full=signature+' {\n'+eventLog+'  var sprite = other.gameObject.GetComponent<SpriteRenderer>();\n  if (sprite != null && ColorUtility.TryParseHtmlString('+JSON.stringify(filterValue)+', out var filterColor)) {\n    var actualColor = (Color32)sprite.color;\n    var expectedColor = (Color32)filterColor;\n    if (actualColor.r == expectedColor.r && actualColor.g == expectedColor.g && actualColor.b == expectedColor.b && actualColor.a == expectedColor.a) {\n'+body+'    }\n  }\n}\n';
  if (body.indexOf('yield return')===-1) return full;
  var routine=methodName+'Routine';
  return signature+' {\n  StartCoroutine('+routine+'(other));\n}\n'+full.replace(signature,'IEnumerator '+routine+'('+parameterType+' other)');
}
Blockly.CSharp.forBlock['when_collision_enter_2d'] = function(block) {

Blockly.CSharp.forBlock['logic_compare'] = function(block) {

  var a0=Blockly.CSharp.valueToCode(block,'A',o)||'0'; var a1=Blockly.CSharp.valueToCode(block,'B',o)||'0';
  return [a0+' '+op+' '+a1,o];
};

Blockly.CSharp.forBlock['math_arithmetic'] = function(block) {

  var a0=Blockly.CSharp.valueToCode(block,'A',o)||'0'; var a1=Blockly.CSharp.valueToCode(block,'B',o)||'0';
  if (op==='POWER') return ['Mathf.Pow('+a0+', '+a1+')',o];

// ══════════════════════════════════════════════
// HELPER FUNCTIONS
// ══════════════════════════════════════════════
function isKeyEventBlock(type) {
  return type==='when_key_pressed'||type==='when_key_not_pressed'||type==='when_key_held';
}
function isMethodEventBlock(type) {
  return type==='when_collision_enter_2d'||type==='when_trigger_enter_2d';
}
function indentCode(code, levels) {
  var indent='    '.repeat(levels);
  return code.split('\n').map(function(l){return l?indent+l:'';}).join('\n');
}

// ══════════════════════════════════════════════
// GENERATE C#
// ══════════════════════════════════════════════
function generateCSharp(className) {
  className=className||'BlocklyProgram';
  Blockly.CSharp.init(workspace);
  Blockly.CSharp.nameDB_=new Blockly.Names(Blockly.CSharp.RESERVED_WORDS_);
  Blockly.CSharp.nameDB_.setVariableMap(workspace.getVariableMap());
  textFieldDeclarations=[]; textFieldObjects={}; prefabDeclarations=[]; targetTransformDeclarations=[]; destroyObjectDeclarations=[]; usesFollowRoutine=false;
  var topBlocks=workspace.getTopBlocks(true);
  var startCode='',updateCode='',methodCode='';
  variableCsNames=[];
  var usedVariables=workspace.getAllVariables().filter(function(m){return workspace.getVariableUsesById(m.getId()).length>0;});
  usedVariables.forEach(function(m){variableCsNames.push(Blockly.CSharp.nameDB_.getName(m.getId(),Blockly.Names.NameType.VARIABLE));});

  topBlocks.forEach(function(block) {
    var code=Blockly.CSharp.blockToCode(block);
    if(!code) return;
    if(isKeyEventBlock(block.type)||block.type==='when_game_updates') updateCode+=code;
    else if(isMethodEventBlock(block.type)) methodCode+=code+'\n';
    else startCode+=code;
  });
  var startWait=startCode.indexOf('yield return')!==-1;
  var updateWait=updateCode.indexOf('yield return')!==-1;

  var fieldCode='';
  textFieldDeclarations.forEach(function(v){
    if (v.indexOf('var:')===0) fieldCode+='    public string '+v.substring(4)+' = "";\n';
    else fieldCode+='    public TMP_Text '+v+';\n';
  });
  variableCsNames.forEach(function(v){
    if (textFieldDeclarations.indexOf('var:'+v)===-1) fieldCode+='    public float '+v+';\n';
  });
  prefabDeclarations.forEach(function(v){fieldCode+='    public GameObject '+v+';\n';});
  targetTransformDeclarations.forEach(function(v){fieldCode+='    public Transform '+v+';\n';});
  destroyObjectDeclarations.forEach(function(v){fieldCode+='    public Transform '+v+';\n';});

  var classBody=fieldCode;
  var textFields=Object.keys(textFieldObjects);
  if(textFields.length) {
    classBody+='    void Awake()\n    {\n';
    textFields.forEach(function(f){classBody+='        if ('+f+' == null) '+f+' = FindText('+JSON.stringify(textFieldObjects[f])+');\n';});
    classBody+='    }\n\n    TMP_Text FindText(string objectName)\n    {\n        foreach (var text in FindObjectsByType<TMP_Text>(FindObjectsInactive.Include, FindObjectsSortMode.None))\n        {\n            if (text.gameObject.name == objectName || (text.transform.parent != null && text.transform.parent.name == objectName))\n                return text;\n        }\n        return null;\n    }\n\n';
  }
  var startBody=(updateWait?'StartCoroutine(UpdateRoutine());\n':'')+startCode;
  if(startBody.trim()){
    var sr=startWait?'IEnumerator':'void';
    classBody+='    '+sr+' Start()\n    {\n'+indentCode(startBody,2)+'    }\n';
  }
  if(updateCode.trim()) {
    if(updateWait) classBody+='\n    IEnumerator UpdateRoutine()\n    {\n        while (true)\n        {\n'+indentCode(updateCode,3)+'            yield return null;\n        }\n    }\n';
    else classBody+='\n    void Update()\n    {\n'+indentCode(updateCode,2)+'    }\n';
  }
  if(methodCode.trim()) classBody+='\n'+indentCode(methodCode,1);
  if(usesFollowRoutine) classBody+='\n    IEnumerator FollowTarget(Transform target, float speed, bool stopAtTarget)\n    {\n        while (target != null)\n        {\n            transform.position = Vector3.MoveTowards(transform.position, target.position, speed * Time.deltaTime);\n            if (stopAtTarget && (transform.position - target.position).sqrMagnitude < 0.0001f)\n                yield break;\n            yield return null;\n        }\n    }\n';
  if(classBody.indexOf('TagExists(')!==-1) classBody+='\n    bool TagExists(string tagName)\n    {\n        try\n        {\n            return GameObject.FindWithTag(tagName) != null;\n        }\n        catch (UnityException)\n        {\n            Debug.LogError("Tag does not exist in Unity (Tags and Layers): " + tagName);\n            return false;\n        }\n    }\n';
  if(classBody.indexOf('DestroyByTag(')!==-1) {
    var holdsText=textFields.length?textFields.map(function(f){return '('+f+' != null && '+f+'.transform.IsChildOf(go.transform))';}).join(' || '):'false';
    classBody+='\n    bool HoldsText(GameObject go)\n    {\n        return '+holdsText+';\n    }\n';
  }
  if(classBody.indexOf('DestroyByTag(')!==-1) classBody+='\n    void DestroyByTag(string tagName)\n    {\n        try\n        {\n            foreach (var tagged in GameObject.FindGameObjectsWithTag(tagName))\n            {\n                if (HoldsText(tagged)) continue;\n                Destroy(tagged);\n            }\n        }\n        catch (UnityException)\n        {\n            Debug.LogError("Tag does not exist in Unity (Tags and Layers): " + tagName);\n        }\n    }\n';
  if(classBody.indexOf('ColorEquals(')!==-1) classBody+='\n    bool ColorEquals(GameObject target, string hex)\n    {\n        if (target == null || !ColorUtility.TryParseHtmlString(hex, out var expected))\n            return false;\n        Color actual;\n        var sprite = target.GetComponent<SpriteRenderer>();\n        if (sprite != null) actual = sprite.color;\n        else\n        {\n            var rend = target.GetComponent<Renderer>();\n            if (rend == null) return false;\n            actual = rend.material.color;\n        }\n        Color32 a = actual, e = expected;\n        return a.r == e.r && a.g == e.g && a.b == e.b && a.a == e.a;\n    }\n';
  classBody+='\n    void MoveBy(Vector2 offset)\n    {\n';
  classBody+='        var body = GetComponent<Rigidbody2D>();\n';
  classBody+='        if (body == null)\n        {\n            Debug.LogError("Add a Rigidbody2D to this object to use Blockly movement.");\n            return;\n        }\n';
  classBody+='        body.MovePosition(body.position + offset);\n';
  classBody+='    }\n';
  var imports='using UnityEngine;\n';
  if(classBody.indexOf('IEnumerator')!==-1) imports+='using System.Collections;\n';
  imports+='using UnityEngine.InputSystem;\nusing TMPro;\n';

  lastGeneratedCode=imports+'\npublic class '+className+' : MonoBehaviour\n{\n'+classBody+'}\n';
  lastClassName=className;
  var output=document.getElementById('codeOutput');
  output.textContent=lastGeneratedCode;
  output.style.display='block';
  document.getElementById('status').textContent='C# gegenereerd';
}

// ══════════════════════════════════════════════
// SAVE / DOWNLOAD C#
// ══════════════════════════════════════════════
function saveCSharp() {
  var fileName='';
  var message='Enter a name for the C# file (required):';
  while(!fileName) {
    var input=prompt(message,lastClassName||'BlocklyProgram');
    if(input===null) return;
    fileName=input.replace(/[^a-zA-Z0-9_]/g,'');
    if(!fileName||/^[0-9]/.test(fileName)) {
      fileName='';
      message='Invalid name. Use letters, digits or _ and do not start with a digit:';
    }
  }
  generateCSharp(fileName);
  downloadFile(fileName+'.cs',lastGeneratedCode);
}

function downloadFile(fileName, content) {
  var blob=new Blob([content],{type:'application/octet-stream'});
  var url=URL.createObjectURL(blob);
  var link=document.createElement('a');
  link.href=url;
  link.download=fileName;
  document.body.appendChild(link);
  link.click();
  setTimeout(function(){
    link.remove();
    URL.revokeObjectURL(url);
  },1000);
  document.getElementById('status').textContent='Download gestart';
}

// ══════════════════════════════════════════════
// RUN / EXPORT JSON
// ══════════════════════════════════════════════
function sendUnity(program) {
  var msg=JSON.stringify(program);
  document.getElementById('status').textContent='Send: '+msg;
  if(window.Unity&&typeof window.Unity.call==='function') Unity.call(msg);
  else if(window.unityInstance&&typeof window.unityInstance.SendMessage==='function')
    window.unityInstance.SendMessage('BlocklyIntegration','OnBlocklyMessage',msg);
  else if(window.location.hostname==='127.0.0.1') {
    fetch('/command',{method:'POST',headers:{'Content-Type':'application/json'},body:msg})
      .then(function(response) {
        if(!response.ok) throw new Error('HTTP '+response.status);
        document.getElementById('status').textContent='Commando naar Unity gestuurd';
      })
      .catch(function(error) {
        document.getElementById('status').textContent='Unity-verbinding mislukt';
        console.error('Unity bridge error:',error);
      });
  } else console.log('Unity niet gevonden:',msg);
}
function runBlockly() { sendUnity(getProgram()); }
function startNewWorkspace() {
  if (workspace.getAllBlocks(false).length &&
      !confirm('Nieuw programma starten? De huidige blokken worden gewist.')) return;

  workspace.clear();
  localStorage.removeItem(autoWorkspaceKey);
  lastSavedName='';
  document.getElementById('status').textContent='Nieuw programma';
}
function exportJson() {
  var payload=JSON.stringify(getProgram(),null,2);
  navigator.clipboard.writeText(payload).then(function(){alert('JSON gekopieerd naar klembord');},
    function(){console.log(payload);alert('Kopieer mislukt. Kijk in de console.');});
}

// ══════════════════════════════════════════════
// WORKSPACE SAVE / LOAD / DELETE
// ══════════════════════════════════════════════
function updateSavedCodeList() {
  var listContainer=document.getElementById('savedCodeList');
  listContainer.innerHTML='';
  var workspaces=[];
  for(var i=0;i<localStorage.length;i++){
    var key=localStorage.key(i);
    if(key.startsWith(savedCodePrefix)&&!key.endsWith('_timestamp')){
      var name=key.replace(savedCodePrefix,'');
      var ts=localStorage.getItem(key+'_timestamp')||'N/A';
      workspaces.push({name:name,timestamp:ts,key:key});
    }
  }
  if(workspaces.length===0){listContainer.innerHTML='<div style="color:#888;">Geen opgeslagen codes</div>';return;}
  // Missing/invalid timestamps ('N/A') count as oldest so they sort last.
  function tsValue(ws){var t=new Date(ws.timestamp).getTime();return isNaN(t)?0:t;}
  workspaces.sort(function(a,b){return tsValue(b)-tsValue(a);});
  workspaces.forEach(function(ws){
    var item=document.createElement('div');
    item.style.cssText='padding:6px;margin:4px 0;background:#2e3438;border-radius:4px;cursor:pointer;';
    var ns=document.createElement('span');
    ns.textContent=ws.name; ns.onclick=function(){loadWorkspaceByKey(ws.key);};
    ns.style.cssText='cursor:pointer;color:#6d4aff;font-weight:bold;';
    var ts=document.createElement('span');
    ts.textContent=' ('+new Date(ws.timestamp).toLocaleTimeString()+')'; ts.style.color='#888';
    var db=document.createElement('span');
    db.textContent=' ✕'; db.style.cssText='float:right;cursor:pointer;color:#c62828;';
    db.onclick=function(e){e.stopPropagation();deleteWorkspaceByKey(ws.key);};
    item.appendChild(ns);item.appendChild(ts);item.appendChild(db);
    listContainer.appendChild(item);
  });
}

function saveWorkspaceWithName() {
  var defaultName=lastSavedName||'myprogram';
  var name=prompt('Geef een naam voor je workspace:',defaultName);
  if(!name) return;
  name=name.replace(/[^a-zA-Z0-9_-]/g,'');
  if(!name){alert('Ongeldige naam.');return;}
  try {
    var xml=Blockly.Xml.workspaceToDom(workspace);
    var xmlText=Blockly.Xml.domToText(xml);
    var key=savedCodePrefix+name;
    localStorage.setItem(key,xmlText);
    localStorage.setItem(key+'_timestamp',new Date().toISOString());
    lastSavedName=name;
    document.getElementById('status').textContent='Workspace "'+name+'" opgeslagen!';
    updateSavedCodeList();
  } catch(e){document.getElementById('status').textContent='Opslaan mislukt: '+e.message;}
}

function loadWorkspaceFromList() {
  updateSavedCodeList();
  var panel=document.getElementById('savedCodePanel');
  panel.style.display=panel.style.display==='none'?'block':'none';
}

function loadWorkspaceByKey(key) {
  try {
    var saved=localStorage.getItem(key);
    if(!saved){alert('Workspace niet gevonden.');return;}
    workspace.clear();
    var xml=Blockly.utils.xml.textToDom(saved);
    Blockly.Xml.domToWorkspace(xml,workspace);
    document.getElementById('status').textContent='Workspace "'+key.replace(savedCodePrefix,'')+'" geladen!';
    document.getElementById('savedCodePanel').style.display='none';
  } catch(e){document.getElementById('status').textContent='Laden mislukt: '+e.message;}
}

function deleteWorkspace() {
  var name=prompt('Welke workspace wil je verwijderen? (Naam):');
  if(!name) return;
  name=name.replace(/[^a-zA-Z0-9_-]/g,'');
  if(!name){alert('Ongeldige naam.');return;}
  var key=savedCodePrefix+name;
  if(confirm('Workspace "'+name+'" permanent verwijderen?')){
    localStorage.removeItem(key);
    localStorage.removeItem(key+'_timestamp');
    document.getElementById('status').textContent='Workspace verwijderd.';
    updateSavedCodeList();
  }
}

function deleteWorkspaceByKey(key) {
  var name=key.replace(savedCodePrefix,'');
  if(confirm('Workspace "'+name+'" permanent verwijderen?')){
    localStorage.removeItem(key);
    localStorage.removeItem(key+'_timestamp');
    document.getElementById('status').textContent='Workspace verwijderd.';
    updateSavedCodeList();
  }
}

function clearAllWorkspaces() {
  if(confirm('Alle opgeslagen workspaces permanent verwijderen? Dit kan niet ongedaan worden gemaakt.')){
    var keysToRemove=[];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k.startsWith(savedCodePrefix)){keysToRemove.push(k);keysToRemove.push(k+'_timestamp');}
    }
    keysToRemove.forEach(function(k){localStorage.removeItem(k);});
    document.getElementById('status').textContent='Alle workspaces verwijderd.';
    updateSavedCodeList();
  }
}

function toggleSavedCodePanel() {
  var panel=document.getElementById('savedCodePanel');
  panel.style.display=panel.style.display==='none'?'block':'none';
  if(panel.style.display==='block') updateSavedCodeList();
}

// Restore the last workspace when Unity opens the editor page.
var autoWorkspace = localStorage.getItem(autoWorkspaceKey);
if (autoWorkspace) {
  try {
    var autoWorkspaceDom = Blockly.utils.xml.textToDom(autoWorkspace);
    Blockly.Xml.domToWorkspace(autoWorkspaceDom, workspace);
  } catch (e) {
    document.getElementById('status').textContent='Workspace herstellen mislukt: '+e.message;
  }
}

workspace.addChangeListener(function(event) {
  if (event.isUiEvent) return;
  try {
    var xml = Blockly.Xml.workspaceToDom(workspace);
    localStorage.setItem(autoWorkspaceKey, Blockly.Xml.domToText(xml));
  } catch (e) {
    console.error('Workspace automatisch opslaan mislukt:',e);
  }
});

updateSavedCodeList();
</script>
</body>
</html>
